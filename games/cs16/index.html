<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter-Strike 1.6</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      height: 44px;
      background: #121215;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 0.85rem;
      z-index: 10;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .controls-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ededed;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .game-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100% - 44px);
      position: relative;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="title-group">
      <span class="badge">CS 1.6</span>
      <span>Counter-Strike 1.6 Web (de_dust2, cs_assault, inferno, aztec)</span>
    </div>
    <div class="controls-group">
      <button class="btn" onclick="toggleFullscreen()">Plein écran</button>
      <a class="btn" href="https://play-cs.com/" target="_blank" rel="noopener">Ouvrir externe ↗</a>
    </div>
  </div>

  <div class="game-wrapper" id="game-container">
    <iframe id="cs-frame" src="https://play-cs.com/" allow="autoplay; fullscreen; pointer-lock"></iframe>
  </div>

  <script>
    function toggleFullscreen() {
      const el = document.getElementById('game-container');
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
