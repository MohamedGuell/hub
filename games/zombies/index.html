<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoD: World at War Zombies</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      height: 44px;
      background: #121215;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 0.85rem;
      z-index: 10;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .badge {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .controls-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ededed;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .game-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100% - 44px);
      position: relative;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .fallback-banner {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 21, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.75rem;
      color: #a1a1aa;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .fallback-banner a {
      color: #60a5fa;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="title-group">
      <span class="badge">WAW ZOMBIES</span>
      <span>Nazi Zombies: Portable (Nacht der Untoten, Verruckt, Shi No Numa, Der Riese)</span>
    </div>
    <div class="controls-group">
      <button class="btn" onclick="toggleFullscreen()">Plein écran</button>
      <a class="btn" href="https://nzp.gay/" target="_blank" rel="noopener">Ouvrir externe ↗</a>
    </div>
  </div>

  <div class="game-wrapper" id="game-container">
    <iframe id="zombies-frame" src="https://nzp.gay/" allow="autoplay; fullscreen; pointer-lock"></iframe>
    <div class="fallback-banner" id="banner">
      <span>Si l'écran reste noir au travail, le domaine externe peut être filtré par le proxy :</span>
      <a href="https://nzp.gay/" target="_blank" rel="noopener">Lancer en direct</a>
      <button style="background:none;border:none;color:#71717a;cursor:pointer;" onclick="document.getElementById('banner').remove()">✕</button>
    </div>
  </div>

  <script>
    function toggleFullscreen() {
      const el = document.getElementById('game-container');
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
