<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct TV & Sport</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ef4444' stroke-width='2'><circle cx='12' cy='12' r='2' fill='%23ef4444'/><path d='M4.93 4.93a10 10 0 0 1 14.14 0'/><path d='M7.76 7.76a6 6 0 0 1 8.48 0'/><path d='M12 14v8'/></svg>">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-elevated: #18181c;
      --surface-hover: #1f1f24;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-secondary: #a1a1aa;
      --red: #ef4444;
      --green: #10b981;
      --accent: #ededed;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    header {
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(16px);
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.15s ease;
    }

    .nav-back:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px 6px 30px;
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
      width: 200px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--border-hover);
      width: 240px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      width: 13px;
      height: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Main Layout */
    .main-layout {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px 40px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      flex: 1;
    }

    @media (max-width: 1024px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Player Container */
    .player-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .video-viewport iframe,
    .video-viewport video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    .player-info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .channel-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .channel-logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .channel-texts h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .channel-texts p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .player-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .action-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--border-hover);
    }

    .live-tag {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-tag .dot {
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
    }

    /* Custom Stream Input Box */
    .custom-stream-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .custom-stream-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .custom-stream-row {
      display: flex;
      gap: 8px;
    }

    .custom-stream-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
      font-family: inherit;
    }

    .custom-stream-row input:focus {
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.07);
    }

    /* Sidebar Channels Area */
    .sidebar-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .category-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .category-pills::-webkit-scrollbar { display: none; }

    .cat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .cat-pill:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .cat-pill.active {
      color: #fff;
      background: #27272a;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .channels-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
      padding-right: 2px;
    }

    .channels-list::-webkit-scrollbar {
      width: 5px;
    }

    .channels-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .channel-item:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateX(2px);
    }

    .channel-item.active {
      background: var(--surface-elevated);
      border-color: rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.1);
    }

    .item-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .item-badge {
      font-size: 0.68rem;
      color: var(--red);
      background: rgba(239, 68, 68, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="../" class="nav-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Hub</span>
      </a>
      <div class="brand">
        <span class="live-dot"></span>
        <span>Direct TV & Sport</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="channel-search" placeholder="Filtrer une chaîne..." oninput="onSearchChange(this.value)">
      </div>
    </div>
  </header>

  <div class="main-layout">
    <!-- Player Area -->
    <div class="player-area">
      <div class="video-viewport" id="viewport">
        <!-- iframe or video rendered dynamically -->
      </div>

      <div class="player-info-bar">
        <div class="channel-meta">
          <div class="channel-logo-badge" id="player-icon">📺</div>
          <div class="channel-texts">
            <h2 id="player-title">Sélectionnez une chaîne</h2>
            <p id="player-sub">Flux direct 24/7 en haute définition</p>
          </div>
        </div>

        <div class="player-actions">
          <span class="live-tag">
            <span class="dot"></span>
            Direct
          </span>
          <button class="action-btn" onclick="reloadCurrentStream()" title="Recharger le flux">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span>Recharger</span>
          </button>
          <button class="action-btn" onclick="toggleFullscreen()" title="Plein écran">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            <span>Plein écran</span>
          </button>
        </div>
      </div>

      <!-- Custom Direct Stream Input -->
      <div class="custom-stream-card">
        <div class="custom-stream-title">Charger un flux direct personnalisé (M3U8 ou YouTube)</div>
        <div class="custom-stream-row">
          <input type="text" id="custom-stream-url" placeholder="Ex: https://exemple.com/live/stream.m3u8 ou lien YouTube">
          <button class="action-btn" onclick="loadCustomStream()" style="background:#27272a;color:#fff;border-color:rgba(255,255,255,0.2);">Lire le flux</button>
        </div>
      </div>
    </div>

    <!-- Sidebar Channels List -->
    <div class="sidebar-area">
      <div class="category-pills">
        <button class="cat-pill active" onclick="filterCategory('all', this)">Tous</button>
        <button class="cat-pill" onclick="filterCategory('news', this)">Actualités</button>
        <button class="cat-pill" onclick="filterCategory('sport', this)">Sport</button>
        <button class="cat-pill" onclick="filterCategory('general', this)">Généraliste</button>
        <button class="cat-pill" onclick="filterCategory('international', this)">International</button>
      </div>

      <div class="channels-list" id="channels-container">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script>
    const CHANNELS = [
      {
        id: 'france24',
        name: 'France 24 (FR)',
        desc: 'Actualités internationales 24/7 en français',
        category: 'news',
        icon: '🇫🇷',
        type: 'yt',
        videoId: 'a47ckXKZjxI'
      },
      {
        id: 'euronews_fr',
        name: 'Euronews (FR)',
        desc: 'L\'actualité européenne et mondiale en continu',
        category: 'news',
        icon: '🇪🇺',
        type: 'yt',
        videoId: 'NiRIbKwAejk'
      },
      {
        id: 'lequipe',
        name: 'L\'Équipe Sport Direct',
        desc: 'Événements sportifs, analyses, débats et multiplex',
        category: 'sport',
        icon: '⚽',
        type: 'yt',
        videoId: 'BUwoXeDg8u4'
      },
      {
        id: 'bfm',
        name: 'BFM TV Direct',
        desc: 'Première chaîne d\'info en continu de France',
        category: 'news',
        icon: '🔴',
        type: 'yt',
        videoId: 'C15czQgHSrE'
      },
      {
        id: 'cnews',
        name: 'CNews',
        desc: 'Information et débats d\'actualité en direct',
        category: 'news',
        icon: '📰',
        type: 'yt',
        videoId: 'r0aK4m7hWwI'
      },
      {
        id: 'arte',
        name: 'Arte TV Direct HD',
        desc: 'Culture, documentaires, concerts et cinéma',
        category: 'general',
        icon: '🎭',
        type: 'yt',
        videoId: 'b5m4l8tO96o'
      },
      {
        id: 'redbull',
        name: 'Red Bull TV Sport',
        desc: 'Sports extrêmes, F1, VTT, moto et surf en direct',
        category: 'sport',
        icon: '🏎️',
        type: 'yt',
        videoId: 'G1IbRujko-A'
      },
      {
        id: 'france24_en',
        name: 'France 24 (English)',
        desc: 'International news and live global coverage',
        category: 'international',
        icon: '🌐',
        type: 'yt',
        videoId: 'h3MuIUNCCzI'
      },
      {
        id: 'skynews',
        name: 'Sky News Live HD',
        desc: 'UK and world breaking news channel',
        category: 'international',
        icon: '🇬🇧',
        type: 'yt',
        videoId: '9Auq9mYxFEE'
      },
      {
        id: 'dw',
        name: 'DW News English',
        desc: 'Deutsche Welle global news broadcasting',
        category: 'international',
        icon: '🇩🇪',
        type: 'yt',
        videoId: 'geT_A4_eL-w'
      },
      {
        id: 'nasa',
        name: 'NASA TV HD',
        desc: 'Direct spatial, lancements et Terre depuis l\'ISS',
        category: 'general',
        icon: '🚀',
        type: 'yt',
        videoId: '21X5lGlDOfg'
      }
    ];

    let currentChannel = null;
    let hlsInstance = null;
    let activeCategory = 'all';
    let searchQuery = '';

    function renderChannels() {
      const container = document.getElementById('channels-container');
      container.innerHTML = '';

      const filtered = CHANNELS.filter(ch => {
        const matchCat = activeCategory === 'all' || ch.category === activeCategory;
        const matchSearch = !searchQuery ||
          ch.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          ch.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Aucune chaîne trouvée</div>';
        return;
      }

      filtered.forEach(ch => {
        const item = document.createElement('div');
        item.className = 'channel-item' + (currentChannel && currentChannel.id === ch.id ? ' active' : '');
        item.onclick = () => selectChannel(ch);

        item.innerHTML = `
          <div class="item-icon">${ch.icon}</div>
          <div class="item-info">
            <div class="item-title">${ch.name}</div>
            <div class="item-sub">${ch.desc}</div>
          </div>
          <span class="item-badge">Live</span>
        `;
        container.appendChild(item);
      });
    }

    function selectChannel(ch) {
      currentChannel = ch;

      document.getElementById('player-icon').textContent = ch.icon;
      document.getElementById('player-title').textContent = ch.name;
      document.getElementById('player-sub').textContent = ch.desc;

      const viewport = document.getElementById('viewport');
      destroyHls();
      viewport.innerHTML = '';

      if (ch.type === 'yt') {
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube-nocookie.com/embed/${ch.videoId}?autoplay=1&mute=0&rel=0`;
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        iframe.setAttribute('allowfullscreen', 'true');
        viewport.appendChild(iframe);
      } else if (ch.type === 'hls') {
        playHlsStream(ch.streamUrl);
      }

      // Record progress to Hub
      recordProgress(ch);
      renderChannels();
    }

    function playHlsStream(url) {
      const viewport = document.getElementById('viewport');
      destroyHls();
      viewport.innerHTML = '';

      const video = document.createElement('video');
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      viewport.appendChild(video);

      if (Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(e => console.log('Autoplay muted requirement', e));
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(e => console.log('Autoplay error', e));
      }
    }

    function destroyHls() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    function loadCustomStream() {
      const input = document.getElementById('custom-stream-url');
      const val = (input.value || '').trim();
      if (!val) return;

      if (val.includes('youtube.com') || val.includes('youtu.be')) {
        let vid = '';
        if (val.includes('v=')) {
          vid = val.split('v=')[1].split('&')[0];
        } else if (val.includes('youtu.be/')) {
          vid = val.split('youtu.be/')[1].split('?')[0];
        }
        if (vid) {
          selectChannel({
            id: 'custom_' + Date.now(),
            name: 'Flux YouTube Personnalisé',
            desc: val,
            category: 'general',
            icon: '▶️',
            type: 'yt',
            videoId: vid
          });
          return;
        }
      }

      // Default as direct HLS stream
      selectChannel({
        id: 'custom_' + Date.now(),
        name: 'Flux Direct Personnalisé',
        desc: val,
        category: 'general',
        icon: '📡',
        type: 'hls',
        streamUrl: val
      });
    }

    function recordProgress(ch) {
      const recordItem = {
        title: ch.name,
        category: 'Direct TV',
        url: window.location.href.split('?')[0] + '?ch=' + ch.id,
        date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }),
        timestamp: Date.now()
      };

      // Notify parent window (Hub)
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'HUB_RECORD_WATCH',
          media: 'zlive',
          item: recordItem
        }, '*');
      }

      // Local storage fallback for standalone tab
      try {
        let activeUser = null;
        const storedUser = localStorage.getItem('hub_active_user');
        if (storedUser) {
          activeUser = JSON.parse(storedUser);
          if (!activeUser.history) activeUser.history = {};
          if (!activeUser.history.zlive) activeUser.history.zlive = [];
          activeUser.history.zlive = activeUser.history.zlive.filter(x => x.title !== ch.name);
          activeUser.history.zlive.unshift(recordItem);
          localStorage.setItem('hub_active_user', JSON.stringify(activeUser));
        }
      } catch (e) {
        console.warn('Storage sync', e);
      }
    }

    function reloadCurrentStream() {
      if (currentChannel) selectChannel(currentChannel);
    }

    function toggleFullscreen() {
      const viewport = document.getElementById('viewport');
      if (!document.fullscreenElement) {
        if (viewport.requestFullscreen) viewport.requestFullscreen();
        else if (viewport.webkitRequestFullscreen) viewport.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function filterCategory(cat, el) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderChannels();
    }

    function onSearchChange(val) {
      searchQuery = val;
      renderChannels();
    }

    // Initialize from URL params or default channel
    window.addEventListener('DOMContentLoaded', () => {
      renderChannels();
      const params = new URLSearchParams(window.location.search);
      const chParam = params.get('ch');
      const vParam = params.get('v');

      if (vParam) {
        selectChannel({
          id: 'yt_param',
          name: 'Direct en cours',
          desc: 'Flux YouTube sélectionné',
          category: 'general',
          icon: '📺',
          type: 'yt',
          videoId: vParam
        });
      } else if (chParam) {
        const found = CHANNELS.find(c => c.id === chParam);
        if (found) selectChannel(found);
        else selectChannel(CHANNELS[0]);
      } else {
        selectChannel(CHANNELS[0]);
      }
    });
  </script>
</body>
</html>
