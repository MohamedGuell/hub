<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct TV & Sport • Matchs en Direct • beIN, Canal+, RMC, DAZN</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ef4444' stroke-width='2'><circle cx='12' cy='12' r='2' fill='%23ef4444'/><path d='M4.93 4.93a10 10 0 0 1 14.14 0'/><path d='M7.76 7.76a6 6 0 0 1 8.48 0'/><path d='M12 14v8'/></svg>">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-elevated: #18181c;
      --surface-hover: #1f1f24;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-secondary: #a1a1aa;
      --red: #ef4444;
      --green: #10b981;
      --blue: #3b82f6;
      --gold: #eab308;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    header {
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 9, 11, 0.94);
      backdrop-filter: blur(16px);
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.15s ease;
    }

    .nav-back:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px 6px 30px;
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
      width: 220px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--border-hover);
      width: 260px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      width: 13px;
      height: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Main Layout */
    .main-layout {
      max-width: 1540px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px 40px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      flex: 1;
    }

    @media (max-width: 1120px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Player Area */
    .player-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .video-viewport iframe,
    .video-viewport video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    /* Server and Controls Bar */
    .player-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .server-selector-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .server-selector-group span {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .server-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      max-width: 320px;
    }

    .server-select:focus {
      border-color: var(--border-hover);
    }

    .player-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .action-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--border-hover);
    }

    .channel-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .channel-logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }

    .channel-logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .channel-texts h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .channel-texts p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Match Center / Dynamic Livsports Section */
    .match-center-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .match-center-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .match-center-title {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .match-center-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.76rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .refresh-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-hover);
    }

    /* Sport Category Filter Tabs */
    .sport-filters-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .sport-filters-row::-webkit-scrollbar {
      display: none;
    }

    .sport-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .sport-pill:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
    }

    .sport-pill.active {
      color: #fff;
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.45);
      font-weight: 500;
    }

    .sport-pill .live-indicator-dot {
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse 1.6s infinite ease-in-out;
    }

    /* Matchs Grid */
    .matchs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
    }

    .match-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .match-card:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .match-card.active {
      border-color: rgba(239, 68, 68, 0.5);
      background: rgba(239, 68, 68, 0.05);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.12);
    }

    .match-card.is-live {
      border-color: rgba(239, 68, 68, 0.35);
    }

    .match-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .match-category-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .match-status-badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .match-status-badge.live {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .match-status-badge.upcoming {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .match-teams-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .match-team-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .match-team-badge {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .match-team-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .match-streams-count {
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Custom Direct Stream Input */
    .custom-stream-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .custom-stream-title {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .custom-stream-row {
      display: flex;
      gap: 8px;
    }

    .custom-stream-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
      font-family: inherit;
    }

    .custom-stream-row input:focus {
      border-color: var(--border-hover);
    }

    /* Sidebar Channels Area */
    .sidebar-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .category-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.76rem;
      padding: 5px 10px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .cat-pill:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    .cat-pill.active {
      color: #fff;
      background: var(--surface-elevated);
      border-color: rgba(239, 68, 68, 0.45);
    }

    .channels-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 720px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .channels-list::-webkit-scrollbar {
      width: 5px;
    }
    .channels-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    .channel-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .channel-item:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateX(2px);
    }

    .channel-item.active {
      background: var(--surface-elevated);
      border-color: rgba(239, 68, 68, 0.45);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.12);
    }

    .item-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .item-badge {
      font-size: 0.68rem;
      color: var(--red);
      background: rgba(239, 68, 68, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .item-badge-hd {
      font-size: 0.68rem;
      color: var(--blue);
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="../" class="nav-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Hub</span>
      </a>
      <div class="brand">
        <span class="live-dot"></span>
        <span>Direct TV & Sport</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="channel-search" placeholder="Rechercher match, club, chaîne..." oninput="onSearchChange(this.value)">
      </div>
    </div>
  </header>

  <div class="main-layout">
    <!-- Player Area -->
    <div class="player-area">
      <div class="video-viewport" id="viewport">
        <!-- Sandboxed video stream player -->
      </div>

      <div class="player-controls-bar">
        <div class="channel-header-info">
          <div class="channel-logo-badge" id="player-icon">⚽</div>
          <div class="channel-texts">
            <h2 id="player-title">Chargement des matchs en direct...</h2>
            <p id="player-sub">Source Livsports • Multi-flux haute définition</p>
          </div>
        </div>

        <div class="server-selector-group">
          <span>Serveur :</span>
          <select class="server-select" id="server-select" onchange="onServerChange(this.value)">
            <option value="livsports" selected>Serveur 1 : Livsports (Lecteur Intégré Direct)</option>
            <option value="streamy">Serveur 2 : Streamonsport (Direct FR)</option>
            <option value="livetv">Serveur 3 : LiveTV SX (Matchs & Multiplex)</option>
            <option value="vipleague">Serveur 4 : VIP League (Flux HD)</option>
            <option value="crack">Serveur 5 : CrackStreams (UFC & Matchs)</option>
          </select>
          <button class="action-btn" onclick="cycleNextServer()" title="Tester le serveur suivant">Serveur suivant ↻</button>
          <button class="action-btn" onclick="openExternalPlayer()" title="Ouvrir dans une fenêtre externe">Lecteur externe ↗</button>
          <button class="action-btn" onclick="toggleFullscreen()" title="Plein écran">Plein écran</button>
        </div>
      </div>

      <!-- Match Center / Programme des matchs du jour (Interrogé depuis Livsports) -->
      <div class="match-center-card">
        <div class="match-center-top">
          <div class="match-center-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Matchs en Direct & Aujourd'hui (Livsports Live)</span>
          </div>
          <div class="match-center-stats">
            <span id="matches-counter">Chargement des matchs...</span>
            <button class="refresh-btn" onclick="refreshMatches(true)" title="Actualiser la liste">
              <span id="refresh-icon">↻</span> Actualiser
            </button>
          </div>
        </div>

        <!-- Sport category filter tabs -->
        <div class="sport-filters-row" id="sport-filters">
          <button class="sport-pill active" onclick="filterSport('live', this)">
            <span class="live-indicator-dot"></span> En Direct
          </button>
          <button class="sport-pill" onclick="filterSport('football', this)">⚽ Football</button>
          <button class="sport-pill" onclick="filterSport('motor-sports', this)">🏎️ F1 & Sports Moteur</button>
          <button class="sport-pill" onclick="filterSport('fight', this)">🥊 Combat & UFC</button>
          <button class="sport-pill" onclick="filterSport('basketball', this)">🏀 Basketball / NBA</button>
          <button class="sport-pill" onclick="filterSport('american-football', this)">🏈 NFL & Sports US</button>
          <button class="sport-pill" onclick="filterSport('tennis', this)">🎾 Tennis</button>
          <button class="sport-pill" onclick="filterSport('all', this)">🌐 Tous les matchs</button>
        </div>

        <div class="matchs-grid" id="matchs-container">
          <!-- Dynamically populated from livsports API -->
        </div>
      </div>

      <!-- Custom Direct Stream Input -->
      <div class="custom-stream-card">
        <div class="custom-stream-title">Charger un flux direct personnalisé (M3U8 ou URL de match)</div>
        <div class="custom-stream-row">
          <input type="text" id="custom-stream-url" placeholder="Ex: https://exemple.com/live/stream.m3u8">
          <button class="action-btn" onclick="loadCustomStream()" style="background:#27272a;color:#fff;border-color:rgba(255,255,255,0.2);">Lire le flux</button>
        </div>
      </div>
    </div>

    <!-- Sidebar Channels Area -->
    <div class="sidebar-area">
      <div class="sidebar-title">
        <span>Chaînes TV 24/7</span>
        <span style="font-size: 0.72rem; color: var(--text-muted);">Flux Direct</span>
      </div>

    // Dynamic Live Matches Fetcher (Queries Livsports / Streamed API)
    async function fetchMatchesFromApi() {
      const endpoints = [
        'https://streamed.pk/api/matches/live',
        'https://streamed.pk/api/matches/all-today',
        'https://streamed.pk/api/matches/football'
      ];

      // Try direct API fetch
      for (const ep of endpoints) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000);
          const res = await fetch(ep, {
            signal: controller.signal,
            headers: { 'Accept': 'application/json' }
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              return processMatchData(data);
            }
          }
        } catch (e) {
          console.warn('Direct fetch attempt failed for ' + ep, e);
        }
      }

      // Try CORS proxy fallback if direct network blocks streamed.pk
      const proxyCandidates = [
        'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://streamed.pk/api/matches/live'),
        'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://streamed.pk/api/matches/live')
      ];

      for (const proxyUrl of proxyCandidates) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 7000);
          const res = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              return processMatchData(data);
            }
          }
        } catch (e) {
          console.warn('Proxy fallback failed for ' + proxyUrl, e);
        }
      }

      return null;
    }

    function processMatchData(items) {
      const now = Date.now();
      const matchMap = new Map();

      items.forEach(item => {
        if (!item || !item.id) return;

        const isLive = item._isLive ||
          (item.date && item.date <= now + 15 * 60 * 1000 && now - item.date < 150 * 60 * 1000);

        matchMap.set(item.id, {
          id: item.id,
          title: item.title || 'Match en Direct',
          category: item.category || 'football',
          date: item.date || now,
          isLive: Boolean(isLive),
          popular: Boolean(item.popular),
          teams: item.teams || {},
          sources: item.sources || []
        });
      });

      const list = Array.from(matchMap.values());
      // Sort: Live first, then by date
      list.sort((a, b) => {
        if (a.isLive && !b.isLive) return -1;
        if (!a.isLive && b.isLive) return 1;
        return a.date - b.date;
      });

      return list;
    }

    async function refreshMatches(isUserClick = false) {

      if (iconEl) iconEl.style.display = 'none';

      try {
        const liveList = await fetchMatchesFromApi();
        if (liveList && liveList.length > 0) {
          allMatches = liveList;
        } else if (allMatches.length === 0) {
          allMatches = getFallbackMatches();
        }
      } catch (err) {
        console.error('Error fetching live matches:', err);
        if (allMatches.length === 0) allMatches = getFallbackMatches();
      }

      if (iconEl) iconEl.style.display = 'inline';
      updateMatchesCounter();
      renderMatches();

      // If no match or channel currently playing, auto-play first live match
      if (!currentMatch && !currentChannel && allMatches.length > 0) {
        selectMatch(allMatches[0]);
      }
    }

      loadMatchStreamUrl(match, 'livsports_main');

      // Fetch sub-stream mirrors asynchronously from streamed.pk/api/stream/{source}/{id}
      if (match.sources && match.sources.length > 0) {
        fetchSubStreams(match);

      recordProgress({
        name: match.title,

      renderChannels();

    async function fetchSubStreams(match) {
      const serverSelect = document.getElementById('server-select');
      let streamCounter = 1;

      for (const s of match.sources.slice(0, 3)) {
        try {
          const res = await fetch(`https://streamed.pk/api/stream/${s.source}/${s.id}`);
          if (res.ok) {
            const list = await res.json();
            if (Array.isArray(list)) {
              list.forEach(item => {
                if (item.embedUrl) {
                  const key = `embed_${item.source || 'src'}_${item.streamNo || streamCounter}`;
                  availableStreams.push({
                    key: key,
                    name: `Serveur Embed ${streamCounter} : ${item.language || 'HD'} (${item.source || 'Stream'})`,
                    url: item.embedUrl
                  });

                  const opt = document.createElement('option');
                  opt.value = key;
                  opt.textContent = `Serveur Embed ${streamCounter} : ${item.language || 'HD'}`;
                  serverSelect.appendChild(opt);

                  streamCounter++;
                }
              });
            }
          }
        } catch (e) {
          // ignore background mirror failures
        }
      }
    }

      viewport.innerHTML = '';

      let targetUrl = '';

      if (serverKey === 'livsports_main') {
        // Direct sandboxed Livsports match embed
        targetUrl = `https://livsports.dpdns.org/match?id=${encodeURIComponent(match.id)}&cat=${encodeURIComponent(match.category)}`;
      } else if (serverKey === 'streamy_backup') {
        targetUrl = 'https://streamysport.net';
      } else if (serverKey === 'livetv_backup') {
        targetUrl = 'https://livetv.sx/frx/allupcomingsports/1/';
      } else {
        // Check dynamic sub-stream mirrors
        const customStream = availableStreams.find(s => s.key === serverKey);
        if (customStream) {
          targetUrl = customStream.url;
        } else {
          targetUrl = `https://livsports.dpdns.org/match?id=${encodeURIComponent(match.id)}&cat=${encodeURIComponent(match.category)}`;
        }
      }

      const iframe = document.createElement('iframe');
      iframe.src = targetUrl;
      iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
      // Sandbox protects from intrusive popups and rogue redirects while running player
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
      viewport.appendChild(iframe);
    }

    // Select and play a 24/7 TV channel
    function selectChannel(ch, serverKey = null) {
      currentChannel = ch;
      currentMatch = null;

      const playerIcon = document.getElementById('player-icon');
      const playerTitle = document.getElementById('player-title');
      const playerSub = document.getElementById('player-sub');
      const serverSelect = document.getElementById('server-select');

      playerIcon.textContent = ch.icon;
      playerTitle.textContent = ch.name;
      playerSub.textContent = ch.desc;

      // Reset server selector options for channel
      serverSelect.innerHTML = `
        <option value="livsports">Serveur 1 : Livsports (Matchs en Direct)</option>
        <option value="streamy">Serveur 2 : Streamonsport (Direct FR)</option>
        <option value="livetv">Serveur 3 : LiveTV SX (Matchs & Multiplex)</option>
        <option value="vipleague">Serveur 4 : VIP League (Flux HD)</option>
        <option value="crack">Serveur 5 : CrackStreams (UFC & Matchs)</option>
      `;

      if (serverKey) {
        currentServer = serverKey;
        serverSelect.value = serverKey;
      } else {
        currentServer = 'livsports';
        serverSelect.value = 'livsports';
      }

      const viewport = document.getElementById('viewport');
      destroyHls();
      viewport.innerHTML = '';

      if (ch.type === 'yt') {
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube-nocookie.com/embed/${ch.videoId}?autoplay=1&mute=0&rel=0`;
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        iframe.setAttribute('allowfullscreen', 'true');
        viewport.appendChild(iframe);
      } else {
        let streamUrl = 'https://livsports.dpdns.org/';
        if (currentServer === 'livsports') {
          streamUrl = ch.livsportsQuery ? `https://livsports.dpdns.org/sport?id=${ch.livsportsQuery}` : 'https://livsports.dpdns.org/';
        } else if (currentServer === 'streamy') {
          streamUrl = ch.streamyUrl || 'https://streamysport.net';
        } else if (currentServer === 'livetv') {
          streamUrl = ch.livetvUrl || 'https://livetv.sx/frx/';
        } else if (currentServer === 'vipleague') {
          streamUrl = ch.vipleagueUrl || 'https://vipleague.im/';
        } else if (currentServer === 'crack') {
          streamUrl = ch.crackUrl || 'https://crackstreams.me/';
        }

        const iframe = document.createElement('iframe');
        iframe.src = streamUrl;
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
        viewport.appendChild(iframe);
      }

      recordProgress(ch);
      renderChannels();
      renderMatches();
    }

    function onServerChange(val) {
      currentServer = val;
      if (currentMatch) {
        loadMatchStreamUrl(currentMatch, val);
      } else if (currentChannel) {
        selectChannel(currentChannel, val);
      }
    }

    function cycleNextServer() {
      const serverSelect = document.getElementById('server-select');
      const count = serverSelect.options.length;
      if (count <= 1) return;

      const currentIdx = serverSelect.selectedIndex;
      const nextIdx = (currentIdx + 1) % count;
      serverSelect.selectedIndex = nextIdx;
      onServerChange(serverSelect.value);
    }

    function openExternalPlayer() {
      let url = 'https://livsports.dpdns.org/';
      if (currentMatch) {
        url = `https://livsports.dpdns.org/match?id=${encodeURIComponent(currentMatch.id)}&cat=${encodeURIComponent(currentMatch.category)}`;
      } else if (currentChannel) {
        url = currentChannel.streamyUrl || 'https://livsports.dpdns.org/';
      }
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function loadCustomStream() {
      const input = document.getElementById('custom-stream-url');
      const val = (input.value || '').trim();
      if (!val) return;

      const viewport = document.getElementById('viewport');
      destroyHls();
      viewport.innerHTML = '';

      if (val.includes('.m3u8')) {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        viewport.appendChild(video);

        if (Hls.isSupported()) {
          hlsInstance = new Hls({ enableWorker: true });
          hlsInstance.loadSource(val);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = val;
          video.play();
        }
      } else {
        const iframe = document.createElement('iframe');
        iframe.src = val;
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
        viewport.appendChild(iframe);
      }

      document.getElementById('player-icon').textContent = '📡';
      document.getElementById('player-title').textContent = 'Flux Direct Personnalisé';
      document.getElementById('player-sub').textContent = val;
    }

    function destroyHls() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    function recordProgress(item) {
      const title = item.name || item.title || 'Direct TV';
      const recordItem = {
        title: title,
        category: 'Direct TV & Sport',
        url: window.location.href.split('?')[0] + (item.id ? '?match=' + item.id : ''),
        date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }),
        timestamp: Date.now()
      };

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'HUB_RECORD_WATCH',
          media: 'zlive',
          item: recordItem
        }, '*');
      }

      try {
        const storedUser = localStorage.getItem('hub_active_user');
        if (storedUser) {
          const activeUser = JSON.parse(storedUser);
          if (!activeUser.history) activeUser.history = {};
          if (!activeUser.history.zlive) activeUser.history.zlive = [];
          activeUser.history.zlive = activeUser.history.zlive.filter(x => x.title !== title);
          activeUser.history.zlive.unshift(recordItem);
          localStorage.setItem('hub_active_user', JSON.stringify(activeUser));
        }
      } catch (e) {
        console.warn('Storage sync', e);
      }
    }

    function toggleFullscreen() {
      const viewport = document.getElementById('viewport');
      if (!document.fullscreenElement) {
        if (viewport.requestFullscreen) viewport.requestFullscreen();
        else if (viewport.webkitRequestFullscreen) viewport.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function filterSport(sport, el) {
      activeSportFilter = sport;
      document.querySelectorAll('.sport-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderMatches();
    }

    function filterChannelCategory(cat, el) {
      activeChannelCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderChannels();
    }

    function onSearchChange(val) {
      searchQuery = val.trim();
      renderMatches();
      renderChannels();
    }

    function renderChannels() {
      const container = document.getElementById('channels-container');
      if (!container) return;
      container.innerHTML = '';

      const filtered = CHANNELS.filter(ch => {
        const matchCat = activeChannelCategory === 'all' || ch.category === activeChannelCategory;
        const matchSearch = !searchQuery ||
          ch.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          ch.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Aucune chaîne trouvée</div>';
        return;
      }

      filtered.forEach(ch => {
        const item = document.createElement('div');
        const isActive = currentChannel && currentChannel.id === ch.id;
        item.className = 'channel-item' + (isActive ? ' active' : '');
        item.onclick = () => selectChannel(ch);

        item.innerHTML = `
          <div class="item-icon">${ch.icon}</div>
          <div class="item-info">
            <div class="item-title">${ch.name}</div>
            <div class="item-sub">${ch.desc}</div>
          </div>
          <span class="item-badge-hd">HD</span>
          <span class="item-badge">Live</span>
        `;
        container.appendChild(item);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderChannels();
      refreshMatches();

      // Check URL parameters for match or channel
      const params = new URLSearchParams(window.location.search);
      const chParam = params.get('ch');
      if (chParam) {
        const foundCh = CHANNELS.find(c => c.id === chParam);
        if (foundCh) selectChannel(foundCh);
      }
    });
  </script>
</body>
</html>
