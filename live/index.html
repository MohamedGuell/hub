<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct TV & Sport • Matchs en Direct • beIN, Canal+, RMC, DAZN</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ef4444' stroke-width='2'><circle cx='12' cy='12' r='2' fill='%23ef4444'/><path d='M4.93 4.93a10 10 0 0 1 14.14 0'/><path d='M7.76 7.76a6 6 0 0 1 8.48 0'/><path d='M12 14v8'/></svg>">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-elevated: #18181c;
      --surface-hover: #1f1f24;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-secondary: #a1a1aa;
      --red: #ef4444;
      --green: #10b981;
      --blue: #3b82f6;
      --gold: #eab308;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    header {
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 9, 11, 0.94);
      backdrop-filter: blur(16px);
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.15s ease;
    }

    .nav-back:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px 6px 30px;
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
      width: 220px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--border-hover);
      width: 260px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      width: 13px;
      height: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Main Layout */
    .main-layout {
      max-width: 1540px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px 40px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      flex: 1;
    }

    @media (max-width: 1120px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Player Area */
    .player-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .video-viewport iframe,
    .video-viewport video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    .channel-hub-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
      color: #fff;
      padding: 30px;
      text-align: center;
      box-sizing: border-box;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }

    .channel-hub-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .channel-hub-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0 0 8px 0;
      color: #fafafa;
    }

    .channel-hub-desc {
      font-size: 0.88rem;
      color: #a1a1aa;
      max-width: 520px;
      margin: 0 0 22px 0;
      line-height: 1.45;
    }

    .channel-hub-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
    }

    .channel-hub-btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      font-family: inherit;
    }

    .channel-hub-btn.primary {
      background: #dc2626;
      border: 1px solid #ef4444;
      color: #fff;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
    }

    .channel-hub-btn.primary:hover {
      background: #b91c1c;
      transform: translateY(-1px);
    }

    .channel-hub-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e4e4e7;
    }

    .channel-hub-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .channel-hub-security {
      font-size: 0.74rem;
      color: #71717a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Server and Controls Bar */
    .player-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .server-selector-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .server-selector-group span {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .server-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      max-width: 360px;
    }

    .server-select:focus {
      border-color: var(--border-hover);
    }

    .player-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .action-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--border-hover);
    }

    .channel-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .channel-logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }

    .channel-texts h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .channel-texts p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Match Center / Dynamic Livsports Section */
    .match-center-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .match-center-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .match-center-title {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .match-center-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.76rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .refresh-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-hover);
    }

    /* Sport Category Filter Tabs */
    .sport-filters-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .sport-filters-row::-webkit-scrollbar {
      display: none;
    }

    .sport-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .sport-pill:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
    }

    .sport-pill.active {
      color: #fff;
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.45);
      font-weight: 500;
    }

    .sport-pill .live-indicator-dot {
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse 1.6s infinite ease-in-out;
    }

    /* Matchs Grid */
    .matchs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
    }

    .match-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .match-card:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .match-card.active {
      border-color: rgba(239, 68, 68, 0.5);
      background: rgba(239, 68, 68, 0.05);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.12);
    }

    .match-card.is-live {
      border-color: rgba(239, 68, 68, 0.35);
    }

    .match-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .match-category-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .match-status-badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .match-status-badge.live {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .match-status-badge.upcoming {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .match-teams-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .match-team-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .match-team-badge {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .match-team-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .match-streams-count {
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Custom Direct Stream Input */
    .custom-stream-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .custom-stream-title {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .custom-stream-row {
      display: flex;
      gap: 8px;
    }

    .custom-stream-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
      font-family: inherit;
    }

    .custom-stream-row input:focus {
      border-color: var(--border-hover);
    }

    /* Sidebar Channels Area */
    .sidebar-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .category-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.76rem;
      padding: 5px 10px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .cat-pill:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    .cat-pill.active {
      color: #fff;
      background: var(--surface-elevated);
      border-color: rgba(239, 68, 68, 0.45);
    }

    .channels-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 720px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .channels-list::-webkit-scrollbar {
      width: 5px;
    }
    .channels-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    .channel-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .channel-item:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateX(2px);
    }

    .channel-item.active {
      background: var(--surface-elevated);
      border-color: rgba(239, 68, 68, 0.45);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.12);
    }

    .item-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .item-badge {
      font-size: 0.68rem;
      color: var(--red);
      background: rgba(239, 68, 68, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .item-badge-hd {
      font-size: 0.68rem;
      color: var(--blue);
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="../" class="nav-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Hub</span>
      </a>
      <div class="brand">
        <span class="live-dot"></span>
        <span>Direct TV & Sport</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="channel-search" placeholder="Rechercher match, club, chaîne..." oninput="onSearchChange(this.value)">
      </div>
    </div>
  </header>

  <div class="main-layout">
    <!-- Player Area -->
    <div class="player-area">
      <div class="video-viewport" id="viewport">
        <!-- Secure sandboxed video player -->
      </div>

      <div class="player-controls-bar">
        <div class="channel-header-info">
          <div class="channel-logo-badge" id="player-icon">⚽</div>
          <div class="channel-texts">
            <h2 id="player-title">L'Équipe 24/24</h2>
            <p id="player-sub">Direct HD • 100% Sécurisé sans publicité</p>
          </div>
        </div>

        <div class="server-selector-group">
          <span>Serveur :</span>
          <select class="server-select" id="server-select" onchange="onServerChange(this.value)">
            <option value="hls_clean" selected>Serveur 1 : Flux HD Direct M3U8 (100% Sécurisé)</option>
            <option value="external_popout">Serveur 2 : Ouvrir en Plein Écran Dédié ↗</option>
          </select>
          <button class="action-btn" onclick="openExternalPlayer()" title="Ouvrir dans une fenêtre externe dédiée">Plein écran ↗</button>
          <button class="action-btn" onclick="toggleFullscreen()" title="Plein écran du lecteur">Agrandir ⛶</button>
        </div>
      </div>

      <!-- Match Center / Programme des matchs du jour (Interrogé depuis Livsports) -->
      <div class="match-center-card">
        <div class="match-center-top">
          <div class="match-center-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Matchs en Direct & Aujourd'hui (Livsports Live)</span>

    // Dynamic Live Matches Fetcher via PPV mirrors
    async function fetchMatchesFromApi() {
      const mirrors = [
        'https://api.ppv.st/api',
        'https://api.ppvs.pk/api',
        'https://api.ppv.tj/api',
        'https://api.ppv.rw/api',
        'https://api.ppv.ms/api'
      ];

      for (const base of mirrors) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000);
          const res = await fetch(`${base}/streams`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.streams) && data.streams.length > 0) {
              return processPpvStreams(data.streams);
            }
          }
        } catch (e) {
          console.warn('API error for ' + base, e);
        }
      }

      return null;
    }

    function processPpvStreams(categories) {
      const now = Date.now();
      const list = [];

      categories.forEach(cat => {
        const catName = cat.category || 'Sports';
        const lowerCat = catName.toLowerCase();

        // Skip non-sports categories
        if (lowerCat.includes('24/7') || lowerCat === 'other') return;

        let catKey = 'other';
        if (lowerCat.includes('american football')) catKey = 'american-football';
        else if (lowerCat.includes('football') || lowerCat.includes('soccer')) catKey = 'football';
        else if (lowerCat.includes('basket')) catKey = 'basketball';
        else if (lowerCat.includes('motor') || lowerCat.includes('f1') || lowerCat.includes('racing')) catKey = 'motor-sports';
        else if (lowerCat.includes('fight') || lowerCat.includes('mma') || lowerCat.includes('box')) catKey = 'fight';
        else if (lowerCat.includes('tennis')) catKey = 'tennis';
        else if (lowerCat.includes('hockey')) catKey = 'hockey';
        else if (lowerCat.includes('rugby')) catKey = 'rugby';
        else if (lowerCat.includes('golf')) catKey = 'golf';
        else if (lowerCat.includes('cricket')) catKey = 'cricket';

        (cat.streams || []).forEach(s => {
          if (!s || !s.id) return;
          const start = s.starts_at || now;
          const end = s.ends_at || 0;
          const isLive = start <= now && (end === 0 || now <= end);

          const servers = [];
          const substreams = s.substreams || [];

          // French commentary first if available
          const frSub = substreams.find(sub => sub.locale === 'fr' && sub.iframe);
          if (frSub) {
            servers.push({
              name: 'Serveur 1 : Français HD 🇫🇷',
              url: frSub.iframe
            });
          }

          if (s.iframe) {
            servers.push({
              name: servers.length === 0 ? 'Serveur 1 : Flux Principal HD' : 'Serveur 2 : Flux Principal HD',
              url: s.iframe
            });
          }

          substreams.forEach(sub => {
            if (sub.iframe && sub !== frSub) {
              const loc = (sub.locale || 'HD').toUpperCase();
              servers.push({
                name: `Serveur ${servers.length + 1} : Multi-Langue (${loc})`,
                url: sub.iframe
              });
            }
          });

          // If this is NFL Network, add the direct official HLS feed as Server 1
          if (s.name && s.name.toLowerCase().includes('nfl network')) {
            servers.unshift({
              name: 'Serveur 1 : Direct HLS HD (Sans Pub)',
              url: 'http://198.58.104.90:8989/nfl/index.m3u8'
            });
          }

          // If this is Golf, add clean direct feeds
          if (s.name && s.name.toLowerCase().includes('golf')) {
            servers.push({
              name: 'Serveur Alternatif : Journal du Golf HD',
              url: 'https://raw.githubusercontent.com/Paradise-91/ParaTV/refs/heads/main/streams/lequipe/journal-du-golf-dm.m3u8'
            });
            servers.push({
              name: 'Serveur Alternatif : 30A Golf HD',
              url: 'https://30a-tv.com/feeds/vidaa/golf.m3u8'
            });
          }

          let homeName = s.name;
          let awayName = '';
          if (s.name && s.name.includes(' vs. ')) {
            const parts = s.name.split(' vs. ');
            homeName = parts[0];
            awayName = parts[1];
          } else if (s.name && s.name.includes(' vs ')) {
            const parts = s.name.split(' vs ');
            homeName = parts[0];
            awayName = parts[1];
          } else if (s.name && s.name.includes(' at ')) {
            const parts = s.name.split(' at ');
            homeName = parts[0];
            awayName = parts[1];
          }

          list.push({
            id: String(s.id),
            title: s.name,
            category: catKey,
            categoryName: catName,
            date: start,
            isLive: Boolean(isLive),
            popular: Boolean(s.tag || isLive),
            tag: s.tag || catName,
            poster: s.poster || '',
            teams: {
              home: { name: homeName, badge: '' },
              away: { name: awayName, badge: '' }
            },
            servers: servers,
            directUrl: servers.length > 0 ? servers[0].url : (s.iframe || '')
          });
        });
      });

      list.sort((a, b) => {
        if (a.isLive && !b.isLive) return -1;
        if (!a.isLive && b.isLive) return 1;
        return a.date - b.date;
      });

      return list;
    }

    // Dynamic TF1/TMC/TFX streams updater from ParaTV master playlist
    async function loadDynamicTvStreams() {
      try {
        const res = await fetch('https://raw.githubusercontent.com/Paradise-91/ParaTV/main/playlists/paratv/group/tf1plus/tf1plus.m3u');
        if (!res.ok) return;
        const text = await res.text();
        const lines = text.split('\n');
        let currentTitle = '';
        const dyn = {};
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (line.startsWith('#EXTINF')) {
            const commaIdx = line.lastIndexOf(',');
            if (commaIdx !== -1) currentTitle = line.slice(commaIdx + 1).trim();
          } else if (line.startsWith('http')) {
            if (/^\d+\.\s+TF1$/.test(currentTitle)) {
              dyn['tf1'] = line;
            } else if (currentTitle.includes('TMC')) {
              dyn['tmc'] = line;
            } else if (currentTitle.includes('TFX')) {
              dyn['tfx'] = line;
            } else if (currentTitle.includes('LCI')) {
              dyn['lci'] = line;
            }
          }
        }
        CHANNELS.forEach(ch => {
          if (dyn[ch.id]) {
            ch.streamUrl = dyn[ch.id];
            if (currentChannel && currentChannel.id === ch.id) {
              playHlsStream(ch.streamUrl, ch);
            }
          }
        });
      } catch (e) {
        console.warn('Could not refresh dynamic TV streams:', e);
      }

    // Launch external popup player on demand
    function launchExternalStream(url) {
      const width = Math.min(1280, window.screen.availWidth || 1280);
      const height = Math.min(760, window.screen.availHeight || 760);
      const left = Math.max(0, (window.screen.availWidth - width) / 2);
      const top = Math.max(0, (window.screen.availHeight - height) / 2);
      window.open(url, 'stream_player', `width=${width},height=${height},top=${top},left=${left},menubar=no,toolbar=no,location=yes,status=no`);
    }

    // In-page stream loader (clean, no sandbox error)
    function loadInPageStream(url) {
      const viewport = document.getElementById('viewport');
      destroyHls();
      viewport.innerHTML = '';

      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
      viewport.appendChild(iframe);
    }

    // Native HTML5 HLS video stream player (0 ads, 0 popups, 0 malware)
    function playHlsStream(streamUrl, ch) {
      const viewport = document.getElementById('viewport');
      destroyHls();
      viewport.innerHTML = '';

      const video = document.createElement('video');
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.background = '#000';
      viewport.appendChild(video);

      if (streamUrl.includes('revma.com') || streamUrl.endsWith('.mp3') || streamUrl.endsWith('.aac')) {
        video.src = streamUrl;
        video.play().catch(e => console.log('Audio autoplay prevented:', e));
        return;
      }

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(e => console.log('Autoplay prevented:', e));
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.warn('Fatal HLS Error:', data.type, data.details);
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                if (data.details === 'manifestLoadError' || data.details === 'manifestParsingError') {
                  console.warn('HLS Manifest error, switching server...');
                  destroyHls();
                  cycleNextServer();
                } else {
                  hlsInstance.startLoad();
                }
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn('HLS Media error, recovering...');
                hlsInstance.recoverMediaError();
                break;
              default:
                destroyHls();
                cycleNextServer();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(() => {});
      }
    }

    // YouTube official player embed (100% clean)
    function playYoutubeStream(videoIdOrUrl, ch) {
      const viewport = document.getElementById('viewport');
      destroyHls();
      viewport.innerHTML = '';

      let src = '';
      if (videoIdOrUrl.startsWith('http')) {
        src = videoIdOrUrl;
      } else {
        src = `https://www.youtube-nocookie.com/embed/${videoIdOrUrl}?autoplay=1&mute=0&rel=0`;
      }

      const iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation allow-popups');
      viewport.appendChild(iframe);
    }

    // Universal server dispatcher
    function playServer(srv, item) {
      if (!srv || !srv.url) return;
      currentServer = srv.url;
      const type = srv.type || (srv.url.includes('.m3u8') ? 'hls' : (srv.url.includes('youtube') ? 'yt' : 'iframe'));

      if (type === 'yt') {
        playYoutubeStream(srv.url, item);
      } else if (type === 'hls' || srv.url.includes('.m3u8')) {
        playHlsStream(srv.url, item);
      } else {
        loadInPageStream(srv.url);
      }
    }

    // Select and play a match directly in the page player
    function selectMatch(match) {
      currentMatch = match;
      currentChannel = null;

      const playerIcon = document.getElementById('player-icon');
      const playerTitle = document.getElementById('player-title');
      const playerSub = document.getElementById('player-sub');

      playerIcon.textContent = getSportEmoji(match.category);
      playerTitle.textContent = match.title;
      playerSub.textContent = `${(match.categoryName || match.category).toUpperCase()} • ${match.isLive ? 'En direct HD' : 'Match programmé'}`;

      const serverSelect = document.getElementById('server-select');
      serverSelect.innerHTML = '';

      const servers = (match.servers && match.servers.length > 0)
        ? match.servers
        : [{ name: 'Serveur 1 : Flux Principal HD', url: match.directUrl || '' }];

      servers.forEach((srv, idx) => {
        const opt = document.createElement('option');
        opt.value = srv.url;
        opt.textContent = srv.name;
        opt.dataset.type = srv.type || (srv.url.includes('.m3u8') ? 'hls' : 'iframe');
        if (idx === 0) opt.selected = true;
        serverSelect.appendChild(opt);
      });

      if (servers.length > 0) {
        playServer(servers[0], match);
      }

      renderMatches();
      renderChannels();
    }

    // Select and play a TV channel directly in the page player
    function selectChannel(ch) {
      currentChannel = ch;
      currentMatch = null;

      const playerIcon = document.getElementById('player-icon');
      const playerTitle = document.getElementById('player-title');
      const playerSub = document.getElementById('player-sub');

      playerIcon.textContent = ch.icon;
      playerTitle.textContent = ch.name;
      playerSub.textContent = (ch.desc || '') + ' • Direct HD';

      const serverSelect = document.getElementById('server-select');
      serverSelect.innerHTML = '';

      const servers = [];

      // 1. First add channel's own direct 24/7 feeds
      if (ch.servers && ch.servers.length > 0) {
        ch.servers.forEach(s => servers.push({ ...s }));
      } else if (ch.type === 'hls' && ch.streamUrl) {
        servers.push({
          name: 'Serveur 1 : Flux HD Direct M3U8 (100% Sécurisé)',
          url: ch.streamUrl,
          type: 'hls'
        });
      } else if (ch.type === 'yt' && ch.videoId) {
        servers.push({
          name: 'Serveur 1 : Flux Officiel YouTube HD',
          url: ch.videoId,
          type: 'yt'
        });
      }

      // 2. If sport channel, append live matches in that sport category as extra choices
      if (ch.sportCategory) {
        const liveEventMatches = allMatches.filter(m => m.category === ch.sportCategory && m.isLive);
        liveEventMatches.slice(0, 4).forEach((m, idx) => {
          if (m.servers && m.servers.length > 0) {
            servers.push({
              name: `Match Direct : ${m.title}`,
              url: m.servers[0].url,
              type: m.servers[0].url.includes('.m3u8') ? 'hls' : 'iframe'
            });
          }
        });
      }

      // 3. Fallback if empty
      if (servers.length === 0) {
        servers.push({
          name: 'Serveur 1 : Flux L\'Équipe 24/24 Direct HD',
          url: 'https://dq37unyetkpcz.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-m04j89j7k5gtp/LEquipe_FR.m3u8',
          type: 'hls'
        });
      }

      servers.forEach((srv, idx) => {
        const opt = document.createElement('option');
        opt.value = srv.url;
        opt.textContent = srv.name;
        opt.dataset.type = srv.type || (srv.url.includes('.m3u8') ? 'hls' : 'iframe');
        if (idx === 0) opt.selected = true;
        serverSelect.appendChild(opt);
      });

      const activeSrv = servers[0];
      playServer(activeSrv, ch);

      renderChannels();
      renderMatches();
    }

    function onServerChange(val) {
      currentServer = val;
      if (!val) return;

      const serverSelect = document.getElementById('server-select');
      const selectedOpt = serverSelect.options[serverSelect.selectedIndex];
      const optType = selectedOpt ? selectedOpt.dataset.type : '';

      playServer({ url: val, type: optType }, currentChannel || currentMatch);
    }

    function cycleNextServer() {
      const serverSelect = document.getElementById('server-select');
      const count = serverSelect.options.length;
      if (count <= 1) return;

      const currentIdx = serverSelect.selectedIndex;
      const nextIdx = (currentIdx + 1) % count;
      serverSelect.selectedIndex = nextIdx;
      onServerChange(serverSelect.value);
    }

    function openExternalPlayer() {
      const serverSelect = document.getElementById('server-select');
      let url = serverSelect && serverSelect.value ? serverSelect.value : '';
      if (!url) return;
      if (currentChannel && currentChannel.videoId && (!url.startsWith('http'))) {
        url = `https://www.youtube.com/watch?v=${url}`;
      }
      launchExternalStream(url);
    }

    function loadCustomStream() {
      const input = document.getElementById('custom-stream-url');
      const val = (input.value || '').trim();
      if (!val) return;

      const viewport = document.getElementById('viewport');
      destroyHls();
      viewport.innerHTML = '';

      if (val.includes('.m3u8')) {
        playHlsStream(val);
      } else {
        loadInPageStream(val);
      }

      document.getElementById('player-icon').textContent = '📡';
      document.getElementById('player-title').textContent = 'Flux Direct Personnalisé';
      document.getElementById('player-sub').textContent = val;
    }

    function destroyHls() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    function toggleFullscreen() {
      const vp = document.getElementById('viewport');
      if (!document.fullscreenElement) {
        vp.requestFullscreen().catch(err => console.log('Fullscreen failed:', err));
      } else {
        document.exitFullscreen();
      }
    }

    function filterSport(cat, el) {
      activeSportFilter = cat;
      document.querySelectorAll('.sport-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderMatches();
    }

    function filterChannelCategory(cat, el) {
      activeChannelCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderChannels();
    }

    function onSearchChange(val) {
      searchQuery = val.trim();
      renderMatches();
      renderChannels();
    }

    function renderChannels() {
      const container = document.getElementById('channels-container');
      if (!container) return;
      container.innerHTML = '';

      const filtered = CHANNELS.filter(ch => {
        const matchCat = activeChannelCategory === 'all' || ch.category === activeChannelCategory;
        const matchSearch = !searchQuery ||
          ch.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          ch.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Aucune chaîne trouvée</div>';
        return;
      }

      filtered.forEach(ch => {
        const item = document.createElement('div');
        const isActive = currentChannel && currentChannel.id === ch.id;
        item.className = 'channel-item' + (isActive ? ' active' : '');
        item.onclick = () => selectChannel(ch);

        item.innerHTML = `
          <div class="item-icon">${ch.icon}</div>
          <div class="item-info">
            <div class="item-title">${ch.name}</div>
            <div class="item-sub">${ch.desc}</div>
          </div>
          <span class="item-badge-hd">HD</span>
          <span class="item-badge">Live</span>
        `;
        container.appendChild(item);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      try { localStorage.removeItem('tv_sport_history'); } catch (e) {}
      renderChannels();
      refreshMatches();
      loadDynamicTvStreams();

      const params = new URLSearchParams(window.location.search);
      const chParam = params.get('ch');
      const matchParam = params.get('match');

      if (chParam) {
        const foundCh = CHANNELS.find(c => c.id === chParam);
        if (foundCh) selectChannel(foundCh);
      } else if (matchParam) {
        // Handled after refreshMatches
      } else {
        // Default to clean HD Live stream: L'Équipe 24/24
        const defaultCh = CHANNELS.find(c => c.id === 'lequipe') || CHANNELS[0];
        if (defaultCh) selectChannel(defaultCh);
      }
    });
  </script>
</body>
